[project]
name = "bookgraph"
version = "0.1.0"
description = "Source-grounded book/document graph wiki pipeline with pluggable parsers, segmenters, wiki backends, and MCP serving."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "markdown-it-py>=3.0",
  "mdit-py-plugins>=0.4",
]

[project.optional-dependencies]
parsers = [
  "markitdown>=0.1.0",
  "pypdf>=4.0",
]
mcp = [
  "fastmcp>=2.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
bookgraph = "bookgraph.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["bookgraph"]
